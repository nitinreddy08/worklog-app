<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Worklog</title>
  <meta name="description" content="Log today's work and send it straight to Google Sheets.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Worklog">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Worklog</h1>

      <div class="date-display">
        <div id="weekday">—</div>
        <div id="full-date">—</div>
      </div>

      <button id="change-date-btn" class="link-btn" type="button" aria-expanded="false" aria-controls="date-picker-wrap">
        Log another date
      </button>

      <div id="date-picker-wrap" class="date-picker-wrap" hidden>
        <label for="date-input">Date</label>
        <input type="date" id="date-input">
        <div class="date-picker-actions">
          <button id="date-confirm-btn" type="button" class="secondary-btn">Use this date</button>
          <button id="date-cancel-btn" type="button" class="text-btn">Cancel</button>
        </div>
      </div>
    </header>

    <div id="offline-banner" class="banner banner-warning" role="status" hidden>
      Offline — worklog will be saved when you're back online.
    </div>
    <div id="sync-banner" class="banner banner-info" role="status" hidden></div>

    <main id="form-view">
      <h2 class="section-title">Today's Worklog</h2>

      <ul id="task-list" aria-label="Work tasks"></ul>

      <button id="add-task-btn" class="secondary-btn add-task-btn" type="button">+ Add another task</button>

      <div id="form-error" class="error-banner" role="alert" hidden></div>

      <button id="save-btn" class="primary-btn" type="button">Save Worklog</button>
    </main>

    <section id="confirmation-view" class="confirmation-view" hidden aria-live="polite">
      <div class="confirm-icon" aria-hidden="true">✓</div>
      <h2 id="confirm-heading">Worklog saved</h2>
      <dl class="confirm-details">
        <div><dt>Date</dt><dd id="confirm-date"></dd></div>
        <div><dt>Entries</dt><dd id="confirm-count"></dd></div>
      </dl>
      <p id="confirm-note" class="confirm-note" hidden></p>
      <button id="done-btn" class="primary-btn" type="button">Done</button>
    </section>
  </div>

  <template id="task-template">
    <li class="task-card">
      <div class="task-card-header">
        <span class="task-number"></span>
        <button type="button" class="remove-task-btn" aria-label="Remove this task">✕</button>
      </div>

      <label class="field-label">
        Ticket
        <input type="text" class="task-ticket" placeholder="e.g. PROJ-123" maxlength="50" autocomplete="off">
      </label>

      <fieldset class="duration-fieldset">
        <legend>Time spent</legend>
        <div class="duration-options">
          <label class="duration-option">
            <input type="radio" class="task-duration-input" value="1d">
            <span>1 Day</span>
          </label>
          <label class="duration-option">
            <input type="radio" class="task-duration-input" value="1st-half">
            <span>1st Half</span>
          </label>
          <label class="duration-option">
            <input type="radio" class="task-duration-input" value="2nd-half">
            <span>2nd Half</span>
          </label>
        </div>
        <div class="duration-time-hint"></div>
      </fieldset>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
